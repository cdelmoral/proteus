---
# Lima config for Proteus, a Credential-Isolated Dev VM.
# Start with: limactl start --name=proteus ./vm/proteus.yaml

vmType: "vz"
arch: "aarch64"

images:
  - location: >-
      https://cloud-images.ubuntu.com/releases/resolute/release-20260823/ubuntu-26.04-server-cloudimg-arm64.img
    digest: >-
      sha256:00e2d9f09373125eb9040952ae3b8d5553fe3df8f5004c08838473a1f61b74bf
    arch: "aarch64"
    variant: "server"

cpus: 2
memory: "4GiB"
disk: "40GiB"

user:
  home: "/home/{{.User}}"
  shell: "/bin/bash"
  passwordlessSudo: true

# Repos and credentials live on the VM disk. Do not mount the macOS home dir.
mounts: []

ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false

# Docker Engine is installed by Ansible Provisioning.
# Lima's containerd is not needed.
containerd:
  system: false
  user: false

portForwards:
  - guestPort: 3000
    hostPort: 3000
    hostIP: "127.0.0.1"
  - guestPort: 5173
    hostPort: 5173
    hostIP: "127.0.0.1"
  - guestPort: 8000
    hostPort: 8000
    hostIP: "127.0.0.1"
  - guestPort: 8080
    hostPort: 8080
    hostIP: "127.0.0.1"
  # Salesforce CLI's OAuth callback during ./enroll salesforce.
  - guestPort: 1717
    hostPort: 1717
    hostIP: "127.0.0.1"

# Ubuntu 26.04 cloud images can otherwise wait on a renamed network interface.
param:
  internal_netplanOptional: "true"

message: |
  proteus is running.

  Run Provisioning from the Proteus repository on macOS:
    ./provision

  Enter the VM:
    limactl shell proteus

  Run Credential Enrollment from macOS for the tools you use, then enter the VM:
    ./enroll github
    ./enroll claude
    ./enroll t3
    ./enroll salesforce
    limactl shell proteus
