---
name: Provisioning CI

on:
  pull_request:
    paths:
      - ".github/**"
      - "Makefile"
      - "provision"
      - "provisioning/**"
      - "requirements-ci.txt"
      - "tests/**"
      - "vm/**"
  push:
    branches:
      - master
    paths:
      - ".github/**"
      - "Makefile"
      - "provision"
      - "provisioning/**"
      - "requirements-ci.txt"
      - "tests/**"
      - "vm/**"

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install static check tools
        run: |
          python -m pip install --requirement requirements-ci.txt
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Install actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint_1.7.7_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          printf '%s  %s\n' \
            023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757 \
            "$archive" | sha256sum --check
          install -d "$HOME/.local/bin"
          tar --extract --gzip --file "$archive" --directory "$HOME/.local/bin" actionlint
          printf '%s\n' "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Install Lima
        run: |
          archive="$RUNNER_TEMP/lima-2.2.0-Linux-x86_64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/lima-vm/lima/releases/download/v2.2.0/lima-2.2.0-Linux-x86_64.tar.gz
          printf '%s  %s\n' \
            a0ea1ccf6b7335a900adb5f8d2b8384457965fecb1ba72f09b4e3e46d12f424a \
            "$archive" | sha256sum --check
          sudo tar --extract --gzip --file "$archive" --directory /usr/local

      - name: Run local tests
        run: make test

      - name: Run static checks
        run: make static

  integration:
    name: Ubuntu 26.04 ARM integration
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Ansible and SSH server
        run: |
          python -m pip install --requirement requirements-ci.txt
          sudo apt-get update
          sudo apt-get install --yes openssh-server

      - name: Run the production playbook twice over SSH
        run: make ci-integration
