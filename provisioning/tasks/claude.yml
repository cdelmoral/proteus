---
- name: Require the supported Claude Code guest platform
  ansible.builtin.assert:
    that:
      - ansible_facts.system == 'Linux'
      - ansible_facts.architecture == 'aarch64'
    fail_msg: Claude Code Provisioning supports the Linux ARM64 guest only.

# Use the same release selector, manifest, and native artifact as install.sh,
# without running an installer that can change user configuration.
- name: Read the latest Claude Code release
  ansible.builtin.uri:
    url: "{{ claude_distribution_url }}/latest"
    return_content: true
  register: claude_release

- name: Validate the Claude Code release selector
  ansible.builtin.assert:
    that: claude_release.content | trim is match('^[0-9]+\.[0-9]+\.[0-9]+$')
    fail_msg: The vendor did not return a supported Claude Code release version.

- name: Select the current Claude Code version
  ansible.builtin.set_fact:
    claude_version: "{{ claude_release.content | trim }}"

- name: Read the Claude Code release manifest
  ansible.builtin.uri:
    url: "{{ claude_distribution_url }}/{{ claude_version }}/manifest.json"
    return_content: true
  register: claude_manifest

- name: Create standalone Claude Code directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ claude_install_dir }}/{{ claude_version }}"
    - "{{ ansible_facts.user_dir }}/.local/bin"

- name: Download and verify the official Linux ARM64 Claude Code binary
  ansible.builtin.get_url:
    url: "{{ claude_distribution_url }}/{{ claude_version }}/linux-arm64/claude"
    dest: "{{ claude_install_dir }}/{{ claude_version }}/claude"
    checksum: "sha256:{{ (claude_manifest.content | from_json).platforms['linux-arm64'].checksum }}"
    mode: "0755"

# Validate before activating the installation. No project Node resolution or
# credential enrollment is needed, even when a project requests a missing Node.
- name: Verify the standalone Claude Code command
  ansible.builtin.command:
    argv:
      - "{{ claude_install_dir }}/{{ claude_version }}/claude"
      - --version
  environment: "{{ managed_user_environment }}"
  changed_when: false

- name: Expose the standalone Claude Code command for interactive use
  ansible.builtin.file:
    src: "{{ claude_install_dir }}/{{ claude_version }}/claude"
    dest: "{{ ansible_facts.user_dir }}/.local/bin/claude"
    state: link
    force: true

- name: Expose the same Claude Code command for background processes
  ansible.builtin.file:
    src: "{{ ansible_facts.user_dir }}/.local/bin/claude"
    dest: /usr/local/bin/claude
    state: link
    force: true
  become: true

- name: Create the Claude Code managed settings directory
  ansible.builtin.file:
    path: /etc/claude-code
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# Unlike ~/.claude/settings.json, which plugin installation updates, Claude
# Code never writes managed settings, so Provisioning can own this file.
- name: Disable Claude Code commit and pull request attribution
  ansible.builtin.copy:
    dest: /etc/claude-code/managed-settings.json
    owner: root
    group: root
    mode: "0644"
    content: >-
      {{ {'attribution': {'commit': '', 'pr': ''}, 'env': {'DISABLE_AUTOUPDATER': '1',
      'CLAUDE_ENV_FILE': ansible_facts.user_dir ~ '/.local/lib/proteus/project-env.sh'}} | to_nice_json }}
  become: true

- name: Read the registered Claude Code marketplaces
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.user_dir }}/.local/bin/claude"
      - plugin
      - marketplace
      - list
      - --json
  register: claude_marketplaces
  environment: "{{ managed_user_environment }}"
  changed_when: false

- name: Register the official Claude Code marketplace
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.user_dir }}/.local/bin/claude"
      - plugin
      - marketplace
      - add
      - anthropics/claude-plugins-official
  environment: >-
    {{ managed_user_environment | combine({
      "CLAUDE_CODE_PLUGIN_PREFER_HTTPS": "1"
    }) }}
  when: >-
    'claude-plugins-official' not in
    (claude_marketplaces.stdout | from_json | map(attribute='name') | list)
  changed_when: true

- name: Install Matt Pocock's Claude Code skills
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.user_dir }}/.local/bin/claude"
      - plugin
      - install
      - mattpocock-skills@claude-plugins-official
  environment: "{{ managed_user_environment }}"
  changed_when: true
