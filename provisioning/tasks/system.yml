---
- name: Apply safe Ubuntu package upgrades
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe
    autoremove: false
    purge: false
    fail_on_autoremove: true
    force_apt_get: true
    dpkg_options: force-confdef,force-confold
  become: true
  when: proteus_upgrade | bool

- name: Install baseline system packages
  ansible.builtin.apt:
    name: "{{ baseline_system_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Create the projects directory
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/projects"
    state: directory
    mode: "0755"
