---
- name: Install the Bash prompt
  ansible.builtin.apt:
    name: "{{ prompt_packages }}"
    state: present
  become: true

- name: Check Starship configuration ownership marker
  ansible.builtin.stat:
    path: "{{ managed_paths_state_dir }}/starship"
  register: starship_marker

- name: Check the Starship configuration before first adoption
  ansible.builtin.stat:
    path: "{{ starship_config_path }}"
  register: starship_config_before_adoption
  when: not starship_marker.stat.exists

- name: Refuse an unmanaged Starship configuration
  ansible.builtin.assert:
    that: not starship_config_before_adoption.stat.exists
    fail_msg: >-
      Refusing to replace unmanaged file {{ starship_config_path }}.
  when: not starship_marker.stat.exists

- name: Create prompt configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: "0755"
  loop:
    - "{{ ansible_user_dir }}/.config"
    - "{{ managed_paths_state_dir }}"

- name: Record Starship configuration ownership
  ansible.builtin.copy:
    content: "Proteus manages {{ starship_config_path }}.\n"
    dest: "{{ managed_paths_state_dir }}/starship"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: "0644"

- name: Install the Starship configuration
  ansible.builtin.copy:
    src: files/starship/starship.toml
    dest: "{{ starship_config_path }}"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: "0644"

- name: Initialize Starship for Bash
  ansible.builtin.blockinfile:
    path: "{{ ansible_user_dir }}/.bashrc"
    create: true
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: Proteus Starship prompt"
    block: |
      eval "$(starship init bash)"
