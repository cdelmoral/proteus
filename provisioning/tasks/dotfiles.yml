---
- name: Install GNU Stow
  ansible.builtin.apt:
    name: stow
    state: present
  become: true

- name: Check for an installed Managed Dotfiles collection
  ansible.builtin.stat:
    path: "{{ managed_dotfiles_dir }}/home"
  register: installed_managed_dotfiles

- name: Check the installed Managed Dotfiles links for conflicts
  ansible.builtin.command:
    argv:
      - stow
      - --simulate
      - --restow
      - --no-folding
      - --dir
      - "{{ managed_dotfiles_dir }}"
      - --target
      - "{{ ansible_facts.user_dir }}"
      - home
  when: installed_managed_dotfiles.stat.isdir | default(false)
  changed_when: false

- name: Unlink the installed Managed Dotfiles collection
  ansible.builtin.command:
    argv:
      - stow
      - --delete
      - --no-folding
      - --dir
      - "{{ managed_dotfiles_dir }}"
      - --target
      - "{{ ansible_facts.user_dir }}"
      - home
  when: installed_managed_dotfiles.stat.isdir | default(false)
  changed_when: true

- name: Remove the installed Managed Dotfiles source
  ansible.builtin.file:
    path: "{{ managed_dotfiles_dir }}"
    state: absent

- name: Install the Managed Dotfiles source
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../dotfiles/"
    dest: "{{ managed_dotfiles_dir }}"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: preserve

- name: Remove declared fresh-image conflicts
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/{{ item }}"
    state: absent
  loop:
    - .bashrc
    - .gitconfig
  when: not (installed_managed_dotfiles.stat.isdir | default(false))

- name: Link the Managed Dotfiles collection
  ansible.builtin.command:
    argv:
      - stow
      - --no-folding
      - --dir
      - "{{ managed_dotfiles_dir }}"
      - --target
      - "{{ ansible_facts.user_dir }}"
      - home
  changed_when: true

- name: Expose the CLI launchers on the system executable path
  ansible.builtin.file:
    src: "{{ ansible_facts.user_dir }}/.local/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - gh
    - opencode
    - sf
    - twg
    - pnpm
    - proteus-project-exec
  become: true

# Shell activation is not run by systemd or agent subprocesses. Generate the
# same mise shims used interactively, then expose only the project entrypoints.
- name: Refresh mise shims for background project commands
  ansible.builtin.command:
    argv:
      - "{{ mise_binary }}"
      - reshim
  environment: "{{ managed_user_environment }}"
  changed_when: true

- name: Expose project Node commands through mise shims
  ansible.builtin.file:
    src: "{{ ansible_facts.user_dir }}/.local/share/mise/shims/{{ item.1 }}"
    dest: "{{ item.0 }}/{{ item.1 }}"
    state: link
    force: true
  loop: "{{ [ansible_facts.user_dir ~ '/.local/bin', '/usr/local/bin'] | product(['node', 'npm', 'npx']) | list }}"
  become: true
