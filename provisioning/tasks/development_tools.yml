---
- name: Install development tool packages
  ansible.builtin.apt:
    name: "{{ development_tool_packages }}"
    state: present
  become: true

- name: Create directories for managed development tools
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_facts.user_dir }}/.cache/proteus"
    - "{{ ansible_facts.user_dir }}/.config/mise"
    - "{{ ansible_facts.user_dir }}/.local/bin"
    - "{{ mise_install_dir }}"

- name: Download the pinned mise binary
  ansible.builtin.get_url:
    url: "{{ mise_download_url }}"
    dest: "{{ mise_binary }}"
    checksum: "{{ mise_checksum }}"
    mode: "0755"

- name: Link mise into the user binary directory
  ansible.builtin.file:
    src: "{{ mise_binary }}"
    dest: "{{ ansible_facts.user_dir }}/.local/bin/mise"
    state: link
    force: true

- name: Read the globally selected Node version
  ansible.builtin.command:
    argv:
      - "{{ mise_binary }}"
      - config
      - get
      - --global
      - tools.node
  register: selected_node_version
  environment: "{{ managed_user_environment }}"
  changed_when: false
  failed_when: false

- name: Find the exact Node installation
  ansible.builtin.command:
    argv:
      - "{{ mise_binary }}"
      - where
      - "node@{{ node_version }}"
  register: installed_node
  environment: "{{ managed_user_environment }}"
  changed_when: false
  failed_when: false

- name: Install and globally select the exact Node version
  ansible.builtin.command:
    argv:
      - "{{ mise_binary }}"
      - use
      - --global
      - --pin
      - "node@{{ node_version }}"
  environment: >-
    {{ managed_user_environment | combine({
      "MISE_NODE_VERIFY": "true",
      "MISE_YES": "1"
    }) }}
  when: >-
    selected_node_version.rc != 0
    or selected_node_version.stdout | trim != node_version
    or installed_node.rc != 0
  changed_when: true

- name: Find the managed Node installation
  ansible.builtin.command:
    argv:
      - "{{ mise_binary }}"
      - where
      - "node@{{ node_version }}"
  register: managed_node
  environment: "{{ managed_user_environment }}"
  changed_when: false

- name: Remove Corepack bundled with Node
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ managed_node.stdout | trim }}/bin/corepack"
    - "{{ managed_node.stdout | trim }}/lib/node_modules/corepack"
    - "{{ ansible_facts.user_dir }}/.local/share/mise/shims/corepack"

- name: Install the latest npm packages
  ansible.builtin.command:
    argv:
      - "{{ managed_node.stdout | trim }}/bin/npm"
      - install
      - --global
      - --no-audit
      - --no-fund
      - "{{ item.package }}@latest"
  loop: "{{ development_npm_packages }}"
  environment: >-
    {{ managed_user_environment | combine({
      "PATH": (managed_node.stdout | trim) ~ "/bin:" ~ ansible_facts.env.PATH
    }) }}
  changed_when: true

- name: Link the npm package commands
  ansible.builtin.file:
    src: "{{ managed_node.stdout | trim }}/bin/{{ item.command }}"
    dest: "{{ item.link | default(ansible_facts.user_dir ~ '/.local/bin/' ~ item.command) }}"
    state: link
    force: true
  loop: "{{ development_npm_packages }}"

- name: Install standalone OpenCode and migrate the old npm installation
  ansible.builtin.import_tasks: opencode.yml

- name: Install standalone Salesforce CLI
  ansible.builtin.import_tasks: salesforce.yml

- name: Install the standalone T3 CLI
  ansible.builtin.import_tasks: t3.yml

- name: Install standalone Claude Code and its public skills
  ansible.builtin.import_tasks: claude.yml

- name: Link the Ubuntu fd command under its expected name
  ansible.builtin.file:
    src: /usr/bin/fdfind
    dest: "{{ ansible_facts.user_dir }}/.local/bin/fd"
    state: link
    follow: false

- name: Install Teamwork Graph CLI and agent skills
  ansible.builtin.import_tasks: teamwork_graph.yml

- name: Install AWS tooling
  ansible.builtin.import_tasks: aws.yml
