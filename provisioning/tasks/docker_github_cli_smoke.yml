---
- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto
  tags:
    - docker
    - github_cli
    - smoke

- name: Inspect the Docker repository key
  ansible.builtin.stat:
    path: "{{ docker_repository_key_path }}"
    checksum_algorithm: sha256
  register: docker_repository_key
  tags:
    - docker
    - smoke

- name: Verify the Docker repository key
  ansible.builtin.assert:
    that:
      - docker_repository_key.stat.isreg
      - docker_repository_key.stat.pw_name == "root"
      - docker_repository_key.stat.gr_name == "root"
      - docker_repository_key.stat.mode == "0644"
      - >-
        docker_repository_key.stat.checksum ==
        (docker_repository_key_checksum | regex_replace('^sha256:', ''))
  tags:
    - docker
    - smoke

- name: Read the Docker apt source
  ansible.builtin.slurp:
    src: "{{ docker_repository_source_path }}"
  register: docker_repository_source
  tags:
    - docker
    - smoke

- name: Verify the Docker apt source
  ansible.builtin.assert:
    that:
      - >-
        'Types: deb' in
        (docker_repository_source.content | b64decode)
      - >-
        'URIs: ' ~ docker_repository_uri in
        (docker_repository_source.content | b64decode)
      - >-
        'Suites: ' ~ docker_repository_suite in
        (docker_repository_source.content | b64decode)
      - >-
        'Components: ' ~ docker_repository_component in
        (docker_repository_source.content | b64decode)
      - >-
        'Architectures: ' ~ docker_repository_architecture in
        (docker_repository_source.content | b64decode)
      - >-
        'Signed-By: ' ~ docker_repository_key_path in
        (docker_repository_source.content | b64decode)
  tags:
    - docker
    - smoke

- name: Verify Docker packages
  ansible.builtin.assert:
    that:
      - >-
        docker_packages
        | difference(ansible_facts.packages.keys() | list)
        | length == 0
    fail_msg: >-
      Missing Docker packages:
      {{ docker_packages
         | difference(ansible_facts.packages.keys() | list)
         | join(', ') }}
  tags:
    - docker
    - smoke

- name: Check the Docker service
  ansible.builtin.command:
    argv:
      - systemctl
      - "{{ item }}"
      - docker
  loop:
    - is-enabled
    - is-active
  register: docker_service_checks
  changed_when: false
  failed_when: false
  tags:
    - docker
    - smoke

- name: Verify the Docker service
  ansible.builtin.assert:
    that:
      - >-
        docker_service_checks.results
        | selectattr('rc', 'ne', 0)
        | list
        | length == 0
    fail_msg: Docker must be enabled and active.
  tags:
    - docker
    - smoke

- name: Inspect active user groups
  ansible.builtin.command:
    argv:
      - id
      - -nG
  register: active_user_groups
  changed_when: false
  tags:
    - docker
    - smoke

- name: Verify active Docker group membership
  ansible.builtin.assert:
    that:
      - "'docker' in active_user_groups.stdout.split()"
    fail_msg: >-
      The active connection for {{ ansible_user_id }} does not include the
      Docker group.
  tags:
    - docker
    - smoke

- name: Check Docker command-line tools
  ansible.builtin.command:
    argv: "{{ item.argv }}"
  loop:
    - name: Docker Engine
      argv:
        - docker
        - version
    - name: Docker Compose
      argv:
        - docker
        - compose
        - version
    - name: Docker Buildx
      argv:
        - docker
        - buildx
        - version
  loop_control:
    label: "{{ item.name }}"
  register: docker_command_checks
  changed_when: false
  failed_when: false
  tags:
    - docker
    - smoke

- name: Verify Docker command-line tools
  ansible.builtin.assert:
    that:
      - >-
        docker_command_checks.results
        | selectattr('rc', 'ne', 0)
        | list
        | length == 0
    fail_msg: >-
      Failed Docker checks:
      {{ docker_command_checks.results
         | selectattr('rc', 'ne', 0)
         | map(attribute='item.name')
         | join(', ') }}
  tags:
    - docker
    - smoke

- name: Inspect the GitHub CLI repository key
  ansible.builtin.stat:
    path: "{{ github_cli_repository_key_path }}"
    checksum_algorithm: sha256
  register: github_cli_repository_key
  tags:
    - github_cli
    - smoke

- name: Verify the GitHub CLI repository key
  ansible.builtin.assert:
    that:
      - github_cli_repository_key.stat.isreg
      - github_cli_repository_key.stat.pw_name == "root"
      - github_cli_repository_key.stat.gr_name == "root"
      - github_cli_repository_key.stat.mode == "0644"
      - >-
        github_cli_repository_key.stat.checksum ==
        (github_cli_repository_key_checksum | regex_replace('^sha256:', ''))
  tags:
    - github_cli
    - smoke

- name: Read the GitHub CLI apt source
  ansible.builtin.slurp:
    src: "{{ github_cli_repository_source_path }}"
  register: github_cli_repository_source
  tags:
    - github_cli
    - smoke

- name: Verify the GitHub CLI apt source
  ansible.builtin.assert:
    that:
      - >-
        'Types: deb' in
        (github_cli_repository_source.content | b64decode)
      - >-
        'URIs: ' ~ github_cli_repository_uri in
        (github_cli_repository_source.content | b64decode)
      - >-
        'Suites: ' ~ github_cli_repository_suite in
        (github_cli_repository_source.content | b64decode)
      - >-
        'Components: ' ~ github_cli_repository_component in
        (github_cli_repository_source.content | b64decode)
      - >-
        'Architectures: ' ~ github_cli_repository_architecture in
        (github_cli_repository_source.content | b64decode)
      - >-
        'Signed-By: ' ~ github_cli_repository_key_path in
        (github_cli_repository_source.content | b64decode)
  tags:
    - github_cli
    - smoke

- name: Verify the GitHub CLI package
  ansible.builtin.assert:
    that:
      - >-
        github_cli_packages
        | difference(ansible_facts.packages.keys() | list)
        | length == 0
    fail_msg: GitHub CLI is not installed from its declared package.
  tags:
    - github_cli
    - smoke

- name: Check GitHub CLI
  ansible.builtin.command:
    argv:
      - gh
      - --version
  changed_when: false
  tags:
    - github_cli
    - smoke
