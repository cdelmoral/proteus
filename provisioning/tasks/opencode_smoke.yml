---
- name: Read the installed OpenCode version
  ansible.builtin.command:
    argv:
      - "{{ ansible_user_dir }}/.local/bin/opencode"
      - --version
  environment: "{{ managed_user_environment }}"
  register: opencode_version_check
  changed_when: false

- name: Verify the installed OpenCode version
  ansible.builtin.assert:
    that: opencode_version_check.stdout | trim == opencode_version
