---
- name: Read the installed OpenCode version
  ansible.builtin.command:
    argv:
      - "{{ ansible_user_dir }}/.local/bin/opencode"
      - --version
  environment: "{{ managed_user_environment }}"
  register: opencode_version_check
  changed_when: false

- name: Validate the OpenCode configuration
  ansible.builtin.command:
    argv:
      - jq
      - -e
      - >-
        .autoupdate == false and
        .model == "openai/gpt-5.6-sol" and
        .agent.plan.permission.bash["*"] == "ask" and
        (has("mcp") | not) and
        (has("tools") | not)
      - "{{ opencode_config_dir }}/opencode.json"
  register: opencode_config_check
  changed_when: false

- name: Validate the OpenCode theme
  ansible.builtin.command:
    argv:
      - jq
      - -e
      - '.theme == "nightowl"'
      - "{{ opencode_config_dir }}/tui.json"
  register: opencode_theme_check
  changed_when: false

- name: Check OpenCode managed-file ownership
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ opencode_config_dir }}/opencode.json"
    - "{{ opencode_config_dir }}/tui.json"
    - "{{ opencode_config_dir }}/AGENTS.md"
    - "{{ opencode_config_dir }}/skills/unslop/SKILL.md"
  register: opencode_owned_files

- name: Check excluded OpenCode command paths
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ opencode_config_dir }}/command/jira.md"
    - "{{ opencode_config_dir }}/commands/jira.md"
  register: opencode_excluded_paths

- name: Verify the OpenCode installation
  ansible.builtin.assert:
    that:
      - opencode_version_check.stdout | trim == opencode_version
      - opencode_config_check.rc == 0
      - opencode_theme_check.rc == 0
      - >-
        not (opencode_excluded_paths.results
        | map(attribute='stat.exists') | max)
      - >-
        opencode_owned_files.results
        | map(attribute='stat.pw_name')
        | unique == [ansible_user_id]
