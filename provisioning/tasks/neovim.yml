---
- name: Install Neovim profile dependencies
  ansible.builtin.apt:
    name: "{{ neovim_packages }}"
    state: present
  become: true

- name: Link the Ubuntu fd command under its expected name
  ansible.builtin.file:
    src: /usr/bin/fdfind
    dest: "{{ ansible_user_dir }}/.local/bin/fd"
    state: link
    follow: false
