---
- name: Install Neovim profile dependencies
  ansible.builtin.apt:
    name: "{{ neovim_packages }}"
    state: present
  become: true

- name: Define the managed Neovim profile
  ansible.builtin.set_fact:
    neovim_managed_files:
      - init.lua
      - lazyvim.json
      - lua/config/lazy.lua
      - lua/config/options.lua
      - lua/config/keymaps.lua
      - lua/plugins/editor.lua
      - lua/plugins/diffview.lua
      - lua/plugins/colorscheme.lua
    neovim_parsers:
      - bash
      - css
      - dockerfile
      - html
      - javascript
      - json
      - jsonc
      - lua
      - markdown
      - markdown_inline
      - query
      - regex
      - terraform
      - tsx
      - typescript
      - vim
      - vimdoc
      - yaml
    neovim_tools:
      - docker-langserver
      - eslint_d
      - hadolint
      - marksman
      - prettier
      - terraform-ls
      - tflint
      - vtsls
      - yaml-language-server
    neovim_mason_packages:
      - docker-compose-language-service
      - dockerfile-language-server
      - eslint_d
      - hadolint
      - json-lsp
      - markdownlint-cli2
      - marksman
      - prettier
      - terraform-ls
      - tflint
      - vtsls
      - yaml-language-server

- name: Check Neovim ownership marker
  ansible.builtin.stat:
    path: "{{ managed_paths_state_dir }}/neovim"
  register: neovim_marker

- name: Check Neovim files before first adoption
  ansible.builtin.stat:
    path: "{{ neovim_config_dir }}/{{ item }}"
  loop: "{{ neovim_managed_files + ['lazy-lock.json'] }}"
  register: neovim_paths_before_adoption
  when: not neovim_marker.stat.exists

- name: Refuse unmanaged Neovim paths
  ansible.builtin.assert:
    that: not item.stat.exists
    fail_msg: "Refusing to replace unmanaged path {{ item.item }}."
  loop: "{{ neovim_paths_before_adoption.results }}"
  when:
    - not neovim_marker.stat.exists
    - item.stat is defined

- name: Check the fd command before first adoption
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.local/bin/fd"
  register: neovim_fd_before_adoption
  when: not neovim_marker.stat.exists

- name: Refuse an unmanaged fd command
  ansible.builtin.assert:
    that: not neovim_fd_before_adoption.stat.exists
    fail_msg: >-
      Refusing to replace unmanaged path {{ ansible_user_dir }}/.local/bin/fd.
  when: not neovim_marker.stat.exists

- name: Create Neovim profile directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: "0755"
  loop:
    - "{{ neovim_config_dir }}"
    - "{{ neovim_config_dir }}/lua/config"
    - "{{ neovim_config_dir }}/lua/plugins"
    - "{{ ansible_user_dir }}/.local/bin"
    - "{{ managed_paths_state_dir }}"

- name: Record Neovim profile ownership
  ansible.builtin.copy:
    content: "Proteus manages the declared LazyVim profile files.\n"
    dest: "{{ managed_paths_state_dir }}/neovim"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: "0644"

- name: Install the Neovim profile
  ansible.builtin.copy:
    src: "files/nvim/{{ item }}"
    dest: "{{ neovim_config_dir }}/{{ item }}"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: "0644"
  loop: "{{ neovim_managed_files }}"
  register: neovim_profile

- name: Link the Ubuntu fd command under its expected name
  ansible.builtin.file:
    src: /usr/bin/fdfind
    dest: "{{ ansible_user_dir }}/.local/bin/fd"
    state: link
    follow: false

- name: Check required LazyVim plugins
  ansible.builtin.command:
    argv:
      - nvim
      - --headless
      - -i
      - NONE
      - >-
        +lua local fs = vim.uv or vim.loop; for name,plugin in
        pairs(require('lazy.core.config').plugins) do
        assert(fs.fs_stat(plugin.dir), 'missing plugin: ' .. name) end
      - +qa
  environment: >-
    {{ managed_development_environment | combine({"PROTEUS_SMOKE": "1"}) }}
  register: neovim_plugin_state
  changed_when: false
  failed_when: false

- name: Check required Treesitter parsers
  ansible.builtin.command:
    argv:
      - nvim
      - --headless
      - -i
      - NONE
      - >-
        +lua for _,lang in ipairs({{ neovim_parsers | to_json }}) do
        if not pcall(vim.treesitter.language.add, lang)
        then vim.cmd('cquit 1') end end
      - +qa
  environment: >-
    {{ managed_development_environment | combine({"PROTEUS_SMOKE": "1"}) }}
  register: neovim_parser_state
  changed_when: false
  failed_when: false

- name: Check required editor tools
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/.local/share/nvim/mason/bin/{{ item }}"
  loop: "{{ neovim_tools }}"
  register: neovim_tool_state

- name: Check Neovim installation completion
  ansible.builtin.stat:
    path: "{{ managed_paths_state_dir }}/neovim-ready"
  register: neovim_ready

- name: Synchronize the LazyVim profile
  ansible.builtin.command:
    argv:
      - nvim
      - --headless
      - +Lazy! sync
      - +qa
  environment: "{{ managed_development_environment }}"
  changed_when: true
  when: >-
    neovim_profile.changed
    or not neovim_ready.stat.exists
    or neovim_plugin_state.rc != 0

- name: Install LazyVim parsers
  ansible.builtin.command:
    argv:
      - nvim
      - --headless
      - +Lazy load nvim-treesitter
      - >-
        +lua require('nvim-treesitter').install(
        {{ neovim_parsers | to_json }}):wait(300000)
      - +qa
  environment: "{{ managed_development_environment }}"
  changed_when: true
  when: >-
    neovim_profile.changed
    or not neovim_ready.stat.exists
    or neovim_parser_state.rc != 0

- name: Install LazyVim editor tools
  ansible.builtin.command:
    argv:
      - nvim
      - --headless
      - +Lazy load mason.nvim
      - "+MasonInstall {{ neovim_mason_packages | join(' ') }}"
      - +qa
  environment: "{{ managed_development_environment }}"
  changed_when: true
  when: >-
    neovim_profile.changed
    or not neovim_ready.stat.exists
    or not (neovim_tool_state.results | map(attribute='stat.exists') | min)

- name: Record a complete Neovim installation
  ansible.builtin.copy:
    content: "The declared LazyVim profile, parsers, and tools are installed.\n"
    dest: "{{ managed_paths_state_dir }}/neovim-ready"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
    mode: "0644"
