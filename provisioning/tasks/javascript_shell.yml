---
- name: Configure the JavaScript shell environment
  ansible.builtin.blockinfile:
    path: "{{ ansible_user_dir }}/.bashrc"
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: Proteus JavaScript toolchain"
    block: |
      export PATH="$HOME/.local/bin:$PATH"
      eval "$("$HOME/.local/bin/mise" activate bash)"
      export PNPM_HOME="$HOME/.local/share/proteus/pnpm/{{ pnpm_version }}"
      export PATH="$PNPM_HOME:$PATH"
