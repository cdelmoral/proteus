---
- name: Provision Proteus
  hosts: all
  gather_facts: false

  pre_tasks:
    - name: Accept a compatible Proteus release before baseline changes
      ansible.builtin.raw: |
        /bin/sh -s -- \
        {{ lookup('ansible.builtin.file', playbook_dir ~ '/../VERSION', rstrip=false)
           | regex_replace('\x00', '<NUL>') | quote }} <<'PROTEUS_RELEASE_GUARD'
        {{ lookup('ansible.builtin.file', playbook_dir ~ '/accept-release.sh', rstrip=false) }}
        PROTEUS_RELEASE_GUARD
      register: release_acceptance
      changed_when: "'__PROTEUS_RELEASE_ACCEPTED__' in release_acceptance.stdout"
      tags:
        - always

    - name: Ensure Python is available for Ansible modules
      ansible.builtin.raw: |
        if [ -x /usr/bin/python3 ]; then
          exit 0
        fi
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y python3
        printf '%s\n' '__PROTEUS_PYTHON_INSTALLED__'
      become: true
      register: python_bootstrap
      changed_when: "'__PROTEUS_PYTHON_INSTALLED__' in python_bootstrap.stdout"
      tags:
        - always

    - name: Gather guest facts
      ansible.builtin.setup:
      tags:
        - always

  handlers:
    - name: Refresh apt metadata after repository changes
      ansible.builtin.apt:
        update_cache: true
      become: true
      listen: Refresh apt metadata for third-party repositories

  tasks:
    - name: Apply the system baseline
      ansible.builtin.import_tasks: tasks/system.yml
      tags:
        - system

    - name: Install the development tools
      ansible.builtin.import_tasks: tasks/development_tools.yml
      tags:
        - development_tools

    - name: Install Managed Dotfiles
      ansible.builtin.import_tasks: tasks/dotfiles.yml
      tags:
        - dotfiles
