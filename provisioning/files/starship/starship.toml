format = """
$directory$git_branch$git_status$cmd_duration
$status$character"""

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "

[status]
disabled = false
format = "[$status]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
format = "[$path]($style) "

[git_branch]
format = "[$symbol$branch]($style) "

[git_status]
format = "([$all_status$ahead_behind]($style) )"
