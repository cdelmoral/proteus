---
# The playbook bootstraps this interpreter; pinning it skips discovery.
ansible_python_interpreter: /usr/bin/python3

managed_user_environment:
  HOME: "{{ ansible_facts.user_dir }}"
  XDG_CONFIG_HOME: "{{ ansible_facts.user_dir }}/.config"

baseline_system_packages:
  - build-essential
  - ca-certificates
  - curl
  - dbus-user-session
  - fzf
  - git
  - gnupg
  - jq
  - neovim
  - openssh-client
  - openssl
  - groff
  - less
  - pipx
  - python3
  - python3-venv
  - ripgrep
  - unzip
  - wget

mise_version: "2026.9.1"
mise_download_url: >-
  https://github.com/jdx/mise/releases/download/v{{ mise_version }}/mise-v{{ mise_version }}-linux-arm64
mise_checksum: >-
  sha256:0ef0a778eaa8599f3e90a8a0979c9fc3f79922cafb5fa6d39f366d974da33bba
mise_install_dir: >-
  {{ ansible_facts.user_dir }}/.local/share/proteus/mise/{{ mise_version }}
mise_binary: "{{ mise_install_dir }}/mise"

node_version: "24.20.0"

development_tool_packages:
  - fd-find
  - git-delta
  - luarocks
  - starship
  - xclip

development_npm_packages:
  - package: pnpm
    command: pnpm
  - package: t3
    command: t3
  # The Managed Dotfiles sf launcher runs this link with fixed settings.
  - package: "@salesforce/cli"
    command: sf
    link: "{{ salesforce_cli_dir }}/sf"

claude_distribution_url: https://downloads.claude.ai/claude-code-releases
claude_install_dir: "{{ ansible_facts.user_dir }}/.local/share/proteus/claude"

salesforce_cli_dir: "{{ ansible_facts.user_dir }}/.local/share/proteus/salesforce-cli"

twg_distribution_url: https://teamwork-graph.atlassian.com/cli
twg_install_dir: "{{ ansible_facts.user_dir }}/.local/share/proteus/twg"

managed_dotfiles_dir: "{{ ansible_facts.user_dir }}/.local/share/proteus/dotfiles"

docker_packages:
  - containerd.io
  - docker-buildx-plugin
  - docker-ce
  - docker-ce-cli
  - docker-compose-plugin
github_cli_packages:
  - gh

third_party_apt_repositories:
  - name: Docker
    key_url: https://download.docker.com/linux/ubuntu/gpg
    key_checksum: >-
      sha256:1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570
    key_path: /etc/apt/keyrings/docker.asc
    source_path: /etc/apt/sources.list.d/docker.sources
    uri: https://download.docker.com/linux/ubuntu
    suite: resolute
    component: stable
    architecture: arm64
  - name: GitHub CLI
    key_url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    key_checksum: >-
      sha256:6084d5d7bd8e288441e0e94fc6275570895da18e6751f70f057485dc2d1a811b
    key_path: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    source_path: /etc/apt/sources.list.d/github-cli.sources
    uri: https://cli.github.com/packages
    suite: stable
    component: main
    architecture: arm64

# AWS CLI archive was verified against AWS's detached PGP signature before
# recording this digest. See docs/provisioning.md for primary sources.
aws_cli_version: "2.38.5"
aws_cli_download_url: "https://awscli.amazonaws.com/awscli-exe-linux-aarch64-{{ aws_cli_version }}.zip"
aws_cli_checksum: "sha256:07711a936e9d271045ab937d2c2c5390c25f419e4ba9e25adb9e996031e3f6be"
aws_cli_extract_dir: "{{ ansible_facts.user_dir }}/.cache/proteus/aws-cli-{{ aws_cli_version }}"
aws_helper_version: "1.8.5"
aws_helper_download_url: >-
  https://rolesanywhere.amazonaws.com/releases/{{ aws_helper_version }}/Aarch64/Linux/Amzn2023/aws_signing_helper
aws_helper_checksum: "sha256:3d131aa888cd56da446f9c6bb460b1f0569f6c7edc74eae6193a2fe3928883ba"
aws_helper_install_dir: "{{ ansible_facts.user_dir }}/.local/share/proteus/aws-helper/{{ aws_helper_version }}"

# Explicit Provisioning owns OpenCode updates; use the official glibc ARM64 archive.
opencode_release_url: https://api.github.com/repos/anomalyco/opencode/releases/latest
opencode_install_dir: "{{ ansible_facts.user_dir }}/.local/share/proteus/opencode"
